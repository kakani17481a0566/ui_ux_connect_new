<section class="bg-white rounded-3xl p-6 shadow-soft border border-slate-100/80" data-purpose="login-form-card">
  <form class="space-y-4" onsubmit="event.preventDefault();">
    <div class="space-y-1.5">
      <label class="block text-xs font-semibold text-slate-700" for="user-identity">
        Username or Email
      </label>
      <div class="relative flex items-center">
        <div class="absolute left-3.5 text-slate-500 pointer-events-none flex items-center">
          <i class="w-4 h-4 text-slate-500" data-lucide="user"></i>
        </div>
        <input class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200/80 focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-xs font-semibold text-slate-800 placeholder-slate-400 transition-all outline-none" id="user-identity" name="identity" placeholder="Username or Email" required="" type="text" value="cha77026">
      </div>
    </div>
    <div class="space-y-1.5">
      <div class="flex justify-between items-center">
        <label class="block text-xs font-semibold text-slate-700" for="user-password">
          Password
        </label>
        <a class="text-xs font-semibold text-slate-600 hover:text-brand-600 transition" href="#">
          Forgot password?
        </a>
      </div>
      <div class="relative flex items-center">
        <div class="absolute left-3.5 text-slate-500 pointer-events-none flex items-center">
          <i class="w-4 h-4 text-slate-500" data-lucide="lock"></i>
        </div>
        <input class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-slate-50 border border-slate-200/80 focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-xs font-semibold text-slate-800 placeholder-slate-400 transition-all outline-none" id="user-password" name="password" placeholder="Password" required="" type="password" value="••••••••••">
        <button aria-label="Toggle password visibility" class="absolute right-3.5 text-slate-500 hover:text-slate-700 p-0.5 focus:outline-none" id="toggle-password-btn" type="button">
          <i class="w-4 h-4" data-lucide="eye" id="eye-icon"></i>
        </button>
      </div>
    </div>
    <div class="pt-2">
      <button class="w-full py-3 px-6 rounded-xl bg-sky-500 hover:bg-sky-600 active:scale-[0.99] text-white font-bold text-sm tracking-wide shadow-btn flex items-center justify-center gap-2 transition-all cursor-pointer" type="submit">

        <span class="">Login to Portal</span>

<!-- JavaScript: Icon Loader & Simple Password Toggle -->
<script data-purpose="lucide-icons-init">
    // Initialize Lucide Icons
    lucide.createIcons();
  </script>
<script data-purpose="ui-interactions">
    // Interactive password visibility toggle
    const toggleBtn = document.getElementById('toggle-password-btn');
    const passwordInput = document.getElementById('user-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        
        // Re-render icon
        if (isPassword) {
          eyeIcon.setAttribute('data-lucide', 'eye-off');
        } else {
          eyeIcon.setAttribute('data-lucide', 'eye');
        }
        lucide.createIcons();
      });
    }
  </script>
